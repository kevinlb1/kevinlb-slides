<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fallbacks for fonts the decks name but nobody has installed, so LibreOffice
  on newcastle substitutes the way PowerPoint on the author's Windows machine
  does. The build installs this beside the course fonts (build-ai100.sh points
  XDG_CONFIG_HOME at the same private tree), where fontconfig merges it with
  the system configuration.

  The chart SVGs in Lecture 1 name Fira Sans, which Office fetches for the
  author from Microsoft's cloud font service; newcastle has it from this
  directory instead, so no rule is needed for it. The rules below cover the
  Windows fonts that Office substitutes silently and that Linux lacks.
  Carlito, Calibri's metric-compatible twin, is bundled here as well: without
  it fontconfig on newcastle fell through to DejaVu Sans, which is wider, and
  the diagram labels on Lecture 1 slide 14 wrapped mid-word.
-->
<fontconfig>
  <alias binding="same">
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Helvetica</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Calibri</family>
    <prefer><family>Carlito</family><family>Liberation Sans</family></prefer>
  </alias>
  <!-- The symbols in the decks (the k of k-nearest neighbours, a neuron's
       x1 x2 x3, a 3x3 image) are set in Cambria Math, Office's maths face,
       which Linux has no copy of. Latin Modern Math is on newcastle and is
       the closest thing to it: Computer Modern's shapes, which is how these
       symbols usually look in print. -->
  <alias binding="same">
    <family>Cambria Math</family>
    <prefer>
      <family>Latin Modern Math</family>
      <family>STIX Two Math</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>
</fontconfig>
